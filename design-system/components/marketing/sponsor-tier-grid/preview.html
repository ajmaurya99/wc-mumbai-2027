<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WCM component: sponsor-tier-grid</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../tools/theme-shim.css">
<link rel="stylesheet" href="../../../tokens/tokens.css">

<style>
/* generated by preview.py: what WordPress emits for blockGap / layout at render time */
.wp-container-core-group-is-layout-1 > *{margin-block-start: 0; margin-block-end: 0;}
.wp-container-core-group-is-layout-1 > * + *{margin-block-start: var(--wp--preset--spacing--40); margin-block-end: 0;}
.wp-container-core-columns-is-layout-2 { gap: var(--wp--preset--spacing--30) var(--wp--preset--spacing--30); }
.wp-container-core-columns-is-layout-3 { gap: var(--wp--preset--spacing--30) var(--wp--preset--spacing--30); }
/* preview chrome (not part of the component) */
.wp-site-blocks { padding-top: 40px; padding-bottom: 40px; }
.ds-preview-label { font: 700 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: #546776; padding: 12px clamp(30px, 5vw, 50px); background: #FFFFFF; border-top: 1px dashed #546776; border-bottom: 1px dashed #546776; margin-top: 40px !important; margin-bottom: 0 !important; }
.ds-preview-label:first-child { margin-top: 0 !important; }
</style>
</head>
<body>
<div class="wp-site-blocks">
<main class="wp-block-group alignfull has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">

<div class="wp-block-group alignwide is-layout-constrained has-global-padding wp-container-core-group-is-layout-1 wp-block-group-is-layout-constrained">

<!-- /wp:paragraph -->

<!-- wp:columns {"align":"wide","style":{"spacing":{"blockGap":{"top":"var:preset|spacing|30","left":"var:preset|spacing|30"}}}} -->
<div class="wp-block-columns alignwide is-layout-flex wp-container-core-columns-is-layout-2 wp-block-columns-is-layout-flex"><!-- wp:column -->

<!-- /wp:image --></div>
<!-- /wp:column -->

<!-- wp:column -->

<p class="has-text-align-center has-accent-2-color has-text-color has-small-font-size" style="font-style:normal;font-weight:700;letter-spacing:0.08em;text-transform:uppercase">Silver sponsors</p>

<!-- /wp:image --></div>
<!-- /wp:column -->

<div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow"><!-- wp:image {"aspectRatio":"3/2","scale":"contain","sizeSlug":"large","linkDestination":"custom"} -->

</html>
