<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WCM component: section-header</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../tools/theme-shim.css">
<link rel="stylesheet" href="../../../tokens/tokens.css">

<style>
/* generated by preview.py: what WordPress emits for blockGap / layout at render time */
.wp-container-core-group-is-layout-1 > *{margin-block-start: 0; margin-block-end: 0;}
.wp-container-core-group-is-layout-1 > * + *{margin-block-start: var(--wp--preset--spacing--20); margin-block-end: 0;}
/* preview chrome (not part of the component) */
.wp-site-blocks { padding-top: 40px; padding-bottom: 40px; }
.ds-preview-label { font: 700 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: #546776; padding: 12px clamp(30px, 5vw, 50px); background: #FFFFFF; border-top: 1px dashed #546776; border-bottom: 1px dashed #546776; margin-top: 40px !important; margin-bottom: 0 !important; }
.ds-preview-label:first-child { margin-top: 0 !important; }
</style>
</head>
<body>
<div class="wp-site-blocks">
<main class="wp-block-group alignfull has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<!-- wp:group {"style":{"spacing":{"blockGap":"var:preset|spacing|20"}},"layout":{"type":"flow"}} -->
<div class="wp-block-group is-layout-flow wp-container-core-group-is-layout-1 wp-block-group-is-layout-flow"><!-- wp:paragraph {"align":"center","style":{"typography":{"textTransform":"uppercase","letterSpacing":"0.08em","fontStyle":"normal","fontWeight":"700"}},"textColor":"accent-2","fontSize":"small"} -->
<p class="has-text-align-center has-accent-2-color has-text-color has-small-font-size" style="font-style:normal;font-weight:700;letter-spacing:0.08em;text-transform:uppercase">Speakers</p>
<!-- /wp:paragraph -->

<!-- wp:heading {"textAlign":"center","fontSize":"x-large"} -->
<h2 class="wp-block-heading has-text-align-center has-x-large-font-size">Voices from the WordPress community</h2>
<!-- /wp:heading -->

<!-- wp:paragraph {"align":"center","textColor":"accent-2","fontSize":"large","fontFamily":"kalam"} -->
<p class="has-text-align-center has-accent-2-color has-text-color has-large-font-size has-kalam-font-family">Aamchi Mumbai, Aapla WordPress</p>
<!-- /wp:paragraph --></div>
<!-- /wp:group -->

</main>
</div>
</body>
</html>
