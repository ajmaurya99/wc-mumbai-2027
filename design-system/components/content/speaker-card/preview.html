<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WCM component: speaker-card</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../tools/theme-shim.css">
<link rel="stylesheet" href="../../../tokens/tokens.css">

<style>
/* generated by preview.py: what WordPress emits for blockGap / layout at render time */
.wp-container-core-columns-is-layout-1 { gap: var(--wp--preset--spacing--30) var(--wp--preset--spacing--30); }
.wp-container-core-group-is-layout-2 > *{margin-block-start: 0; margin-block-end: 0;}
.wp-container-core-group-is-layout-2 > * + *{margin-block-start: var(--wp--preset--spacing--20); margin-block-end: 0;}
.wp-container-core-group-is-layout-3 > *{margin-block-start: 0; margin-block-end: 0;}
.wp-container-core-group-is-layout-3 > * + *{margin-block-start: var(--wp--preset--spacing--20); margin-block-end: 0;}
.wp-container-core-group-is-layout-4 > *{margin-block-start: 0; margin-block-end: 0;}
.wp-container-core-group-is-layout-4 > * + *{margin-block-start: var(--wp--preset--spacing--20); margin-block-end: 0;}
/* preview chrome (not part of the component) */
.wp-site-blocks { padding-top: 40px; padding-bottom: 40px; }
.ds-preview-label { font: 700 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: #546776; padding: 12px clamp(30px, 5vw, 50px); background: #FFFFFF; border-top: 1px dashed #546776; border-bottom: 1px dashed #546776; margin-top: 40px !important; margin-bottom: 0 !important; }
.ds-preview-label:first-child { margin-top: 0 !important; }
</style>
</head>
<body>
<div class="wp-site-blocks">
<main class="wp-block-group alignfull has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<!-- wp:columns {"align":"wide","style":{"spacing":{"blockGap":{"top":"var:preset|spacing|30","left":"var:preset|spacing|30"}}}} -->
<div class="wp-block-columns alignwide is-layout-flex wp-container-core-columns-is-layout-1 wp-block-columns-is-layout-flex">
<!-- wp:column -->
<div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow"><!-- wp:group {"className":"wcm-card","style":{"border":{"radius":"16px"},"spacing":{"padding":{"top":"var:preset|spacing|40","bottom":"var:preset|spacing|40","left":"var:preset|spacing|40","right":"var:preset|spacing|40"},"blockGap":"var:preset|spacing|20"}},"backgroundColor":"accent-5","layout":{"type":"flow"}} -->
<div class="wp-block-group wcm-card has-accent-5-background-color has-background is-layout-flow wp-container-core-group-is-layout-2 wp-block-group-is-layout-flow" style="border-radius:16px;padding-top:var(--wp--preset--spacing--40);padding-right:var(--wp--preset--spacing--40);padding-bottom:var(--wp--preset--spacing--40);padding-left:var(--wp--preset--spacing--40)"><!-- wp:image {"aspectRatio":"1","scale":"cover","sizeSlug":"large","style":{"border":{"radius":"16px"}}} -->
<figure class="wp-block-image size-large has-custom-border"><img src="https://placehold.co/600x600/546776/ffffff.png?text=Photo" alt="Speaker Name" style="border-radius:16px;aspect-ratio:1;object-fit:cover"/></figure>
<!-- /wp:image -->

<!-- wp:heading {"level":3,"fontSize":"large"} -->
<h3 class="wp-block-heading has-large-font-size">Speaker Name</h3>
<!-- /wp:heading -->

<!-- wp:paragraph {"textColor":"accent-4","fontSize":"small"} -->
<p class="has-accent-4-color has-text-color has-small-font-size">Role, Company</p>
<!-- /wp:paragraph --></div>
<!-- /wp:group --></div>
<!-- /wp:column -->

<!-- wp:column -->
<div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow"><!-- wp:group {"className":"wcm-card","style":{"border":{"radius":"16px"},"spacing":{"padding":{"top":"var:preset|spacing|40","bottom":"var:preset|spacing|40","left":"var:preset|spacing|40","right":"var:preset|spacing|40"},"blockGap":"var:preset|spacing|20"}},"backgroundColor":"accent-5","layout":{"type":"flow"}} -->
<div class="wp-block-group wcm-card has-accent-5-background-color has-background is-layout-flow wp-container-core-group-is-layout-3 wp-block-group-is-layout-flow" style="border-radius:16px;padding-top:var(--wp--preset--spacing--40);padding-right:var(--wp--preset--spacing--40);padding-bottom:var(--wp--preset--spacing--40);padding-left:var(--wp--preset--spacing--40)"><!-- wp:image {"aspectRatio":"1","scale":"cover","sizeSlug":"large","style":{"border":{"radius":"16px"}}} -->
<figure class="wp-block-image size-large has-custom-border"><img src="https://placehold.co/600x600/546776/ffffff.png?text=Photo" alt="Speaker Name" style="border-radius:16px;aspect-ratio:1;object-fit:cover"/></figure>
<!-- /wp:image -->

<!-- wp:heading {"level":3,"fontSize":"large"} -->
<h3 class="wp-block-heading has-large-font-size">Speaker Name</h3>
<!-- /wp:heading -->

<!-- wp:paragraph {"textColor":"accent-4","fontSize":"small"} -->
<p class="has-accent-4-color has-text-color has-small-font-size">Core contributor, WordPress</p>
<!-- /wp:paragraph --></div>
<!-- /wp:group --></div>
<!-- /wp:column -->

<!-- wp:column -->
<div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow"><!-- wp:group {"className":"wcm-card","style":{"border":{"radius":"16px"},"spacing":{"padding":{"top":"var:preset|spacing|40","bottom":"var:preset|spacing|40","left":"var:preset|spacing|40","right":"var:preset|spacing|40"},"blockGap":"var:preset|spacing|20"}},"backgroundColor":"accent-5","layout":{"type":"flow"}} -->
<div class="wp-block-group wcm-card has-accent-5-background-color has-background is-layout-flow wp-container-core-group-is-layout-4 wp-block-group-is-layout-flow" style="border-radius:16px;padding-top:var(--wp--preset--spacing--40);padding-right:var(--wp--preset--spacing--40);padding-bottom:var(--wp--preset--spacing--40);padding-left:var(--wp--preset--spacing--40)"><!-- wp:image {"aspectRatio":"1","scale":"cover","sizeSlug":"large","style":{"border":{"radius":"16px"}}} -->
<figure class="wp-block-image size-large has-custom-border"><img src="https://placehold.co/600x600/546776/ffffff.png?text=Photo" alt="Speaker Name" style="border-radius:16px;aspect-ratio:1;object-fit:cover"/></figure>
<!-- /wp:image -->

<!-- wp:heading {"level":3,"fontSize":"large"} -->
<h3 class="wp-block-heading has-large-font-size">Speaker Name</h3>
<!-- /wp:heading -->

<!-- wp:paragraph {"textColor":"accent-4","fontSize":"small"} -->
<p class="has-accent-4-color has-text-color has-small-font-size">Founder, Agency name</p>
<!-- /wp:paragraph --></div>
<!-- /wp:group --></div>
<!-- /wp:column -->
</div>
<!-- /wp:columns -->

</main>
</div>
</body>
</html>
