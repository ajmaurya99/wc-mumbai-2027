/* generated by preview.py: what WordPress emits for blockGap / layout at render time */
.wp-container-core-group-is-layout-1 > *{margin-block-start: 0; margin-block-end: 0;}
.wp-container-core-group-is-layout-1 > * + *{margin-block-start: var(--wp--preset--spacing--30); margin-block-end: 0;}
.wp-container-core-group-is-layout-2 { gap: var(--wp--preset--spacing--30) var(--wp--preset--spacing--30); }
.wp-container-core-group-is-layout-3 > *{margin-block-start: 0; margin-block-end: 0;}
.wp-container-core-group-is-layout-3 > * + *{margin-block-start: 0; margin-block-end: 0;}

.wp-container-core-group-is-layout-6 { gap: var(--wp--preset--spacing--30) var(--wp--preset--spacing--30); }
.wp-container-core-group-is-layout-7 > *{margin-block-start: 0; margin-block-end: 0;}
.wp-container-core-group-is-layout-7 > * + *{margin-block-start: 0; margin-block-end: 0;}
/* preview chrome (not part of the component) */
.wp-site-blocks { padding-top: 40px; padding-bottom: 40px; }
.ds-preview-label { font: 700 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: #546776; padding: 12px clamp(30px, 5vw, 50px); background: #FFFFFF; border-top: 1px dashed #546776; border-bottom: 1px dashed #546776; margin-top: 40px !important; margin-bottom: 0 !important; }
.ds-preview-label:first-child { margin-top: 0 !important; }
</style>
</head>
